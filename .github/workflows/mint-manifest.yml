name: Refresh GPK mint numbers

# Updates the mint-number backup in manifests/mints, separately from the
# monthly holders run so a slow or rate-limited AtomicHub can never break it.
#
#   incremental (default): looks up only cards missing from the backup
#                          (newly opened packs). Mint numbers never change.
#   full:                  re-checks every card (slow, ~1-2 h; refreshes the
#                          circulating/burned counts shown in tooltips).
#
# Reads the SimpleAssets id list committed by the holders workflow
# (manifests/gpk-sa-asset-ids.txt), so run that one at least once first.
#
# Scheduled twice daily. Like cheesehub's lp-history.yml, each 12-hour slot
# gets four ticks spread evenly across it, because GitHub's shared cron queue
# often delays ticks by hours or drops them entirely — incremental runs are
# cheap no-ops when there is nothing new, so the extra ticks are free.
# Scheduled runs always use incremental mode; full mode is manual-only.

on:
  schedule:
    - cron: '47 0 * * *'
    - cron: '47 3 * * *'
    - cron: '47 6 * * *'
    - cron: '47 9 * * *'
    - cron: '47 12 * * *'
    - cron: '47 15 * * *'
    - cron: '47 18 * * *'
    - cron: '47 21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'incremental = new cards only, full = re-check every card'
        type: choice
        options: [incremental, full]
        default: incremental

permissions:
  contents: write

concurrency:
  group: gpk-manifests
  cancel-in-progress: false

jobs:
  refresh-mints:
    runs-on: ubuntu-latest
    # Incremental runs take ~5 min; a short timeout kills a hung run fast.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Look up mint numbers
        env:
          # Scheduled runs are always incremental; full mode is manual-only.
          MODE: ${{ github.event_name == 'schedule' && 'incremental' || (inputs.mode || 'incremental') }}
        # Exit code 2 = some batches failed; previous values are kept, so still publish.
        run: |
          FLAGS="--fresh"
          [ "$MODE" = "incremental" ] && FLAGS="$FLAGS --incremental"
          echo "Mode: $MODE ($FLAGS)"
          node scripts/build-mint-manifest.mjs $FLAGS || [ $? -eq 2 ]

      - name: Install fflate for the records ZIP
        run: npm install --no-save fflate@0.8.3

      - name: Build records ZIP (committed holders + updated mints)
        run: node scripts/build-records-zip.mjs

      - name: Upload records ZIP to the backup repo's latest release
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          BACKUP_REPO: bewbzz/gpkonwaxbackup
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::BACKUP_REPO_TOKEN not set — records ZIP built but not uploaded."
            exit 0
          fi
          TAG=$(gh release view --repo "$BACKUP_REPO" --json tagName -q .tagName)
          gh release upload "$TAG" dist-records/gpk-records.zip --repo "$BACKUP_REPO" --clobber

      - name: Commit updated mint backup
        run: |
          git config user.name "gpk-mints-bot"
          git config user.email "actions@github.com"
          git add manifests/mints manifests/gpk-sa-asset-ids.txt
          if git diff --cached --quiet; then
            echo "No new mint numbers."
          else
            git commit -m "chore: refresh gpk mint backup ($(date -u +%Y-%m-%d))"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
